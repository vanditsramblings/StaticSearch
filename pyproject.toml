[project]
name = "hypersearch"
version = "0.1.0"
description = "BYOD semantic search engine — embedded DuckDB + local embeddings"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # === Web Framework ===
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",

    # === Data Validation ===
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",

    # === Embedded Database ===
    "duckdb>=1.2,<2.0",

    # === ML / Embeddings ===
    "sentence-transformers>=3.3,<4.0",
    "numpy>=1.26,<3.0",

    # === Data Processing ===
    "polars>=1.17,<2.0",

    # === CLI ===
    "typer>=0.15,<1.0",

    # === Telemetry ===
    "psutil>=6.1,<7.0",

    # === File Upload ===
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

bench = [
    "locust>=2.32,<3.0",
]

[project.scripts]
hypersearch = "hypersearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
