[project]
name = "hypersearch"
version = "0.2.0"
description = "BYOD semantic search engine — embedded DuckDB + local embeddings. Zero infrastructure, hyper-fast search over static data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "semantic-search",
    "vector-search",
    "embeddings",
    "duckdb",
    "hnsw",
    "sentence-transformers",
    "search-engine",
    "static-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vanditsramblings/StaticSearch"
Repository = "https://github.com/vanditsramblings/StaticSearch"
Issues = "https://github.com/vanditsramblings/StaticSearch/issues"
Documentation = "https://github.com/vanditsramblings/StaticSearch#readme"

dependencies = [
    # === Web Framework ===
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",

    # === Data Validation ===
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",

    # === Embedded Database ===
    "duckdb>=1.2,<2.0",

    # === ML / Embeddings ===
    "sentence-transformers>=3.3,<4.0",
    "numpy>=1.26",

    # === Data Processing ===
    "polars>=1.17,<2.0",
    "pyarrow>=14.0",

    # === CLI ===
    "typer>=0.15,<1.0",

    # === Telemetry ===
    "psutil>=6.1,<7.0",

    # === File Upload ===
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "build>=1.0",
    "twine>=6.0",
]

bench = [
    "locust>=2.32,<3.0",
]

[project.scripts]
hypersearch = "hypersearch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypersearch*"]
exclude = ["tests*", "benchmarks*", "datasets*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that take >10 seconds (deselect with '-m \"not slow\"')",
]
